name: Point 11 Option B PAGE_SIZE 15 iPhone finalist

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-finalist-15"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private test repository
        uses: actions/checkout@v4

      - name: Assemble sealed baseline and create isolated PAGE_SIZE 15 finalist
        shell: bash
        run: |
          set -euo pipefail
          echo "dcfc3463bac96efb5bc8ced169e8da1774448f0d59604820763841135c508657  PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART1_OF_3.zip" | sha256sum -c -
          echo "33219b75522b9588912fae583bfb7f2247d882428a949616c0bfb74597e28f8a  PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART2_OF_3.zip" | sha256sum -c -
          echo "cd4ff74fab3b747a39308999123f2aaa8e8a164ad3eb0a3338a836c804aae90d  PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART3_OF_3.zip" | sha256sum -c -
          rm -rf _site
          mkdir -p _site
          unzip -q PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART1_OF_3.zip -d _site
          unzip -q PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART2_OF_3.zip -d _site
          unzip -q PUNKT11_OPTION_B_SITE_ONLY_v1.00_PART3_OF_3.zip -d _site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('_site')
          inventory = root / 'inventory-view.js'
          source = inventory.read_text(encoding='utf-8')
          assert source.count('const PAGE_SIZE = 20;') == 1
          inventory.write_text(source.replace('const PAGE_SIZE = 20;', 'const PAGE_SIZE = 15;'), encoding='utf-8')

          integrity_path = root / 'integrity.json'
          old = json.loads(integrity_path.read_text(encoding='utf-8'))
          entries = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'integrity.json'):
              data = p.read_bytes()
              entries.append({
                  'bytes': len(data),
                  'path': p.relative_to(root).as_posix(),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          obj = {
              'appVersion': old['appVersion'],
              'files': entries,
              'schemaVersion': old.get('schemaVersion', 1),
          }
          integrity_path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          h = hashlib.sha256()
          files = sorted(p for p in root.rglob('*') if p.is_file())
          for p in files:
              rel = p.relative_to(root).as_posix()
              data = p.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              size = len(data)
              h.update(rel.encode('utf-8')); h.update(b'\0')
              h.update(digest.encode('ascii')); h.update(b'\0')
              h.update(str(size).encode('ascii')); h.update(b'\n')
          tree = h.hexdigest()
          print('PAGE_SIZE 15 site tree:', tree)
          assert tree == '0eefb7de4c03ce24d35280509184d67bbb936aa0dab32545e9cb4e780718df76'
          assert len(files) == 178
          assert len(list((root / 'assets/images/inventory').glob('*'))) == 154
          assert 'const PAGE_SIZE = 15;' in inventory.read_text(encoding='utf-8')
          assert len(obj['files']) == 177
          for e in obj['files']:
              data = (root / e['path']).read_bytes()
              assert len(data) == e['bytes']
              assert hashlib.sha256(data).hexdigest() == e['sha256']
          print('PAGE_SIZE 15 FINALIST SOURCE LOCK: PASS')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PAGE_SIZE 15 finalist
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PAGE_SIZE 15 finalist
        id: deployment
        uses: actions/deploy-pages@v4
